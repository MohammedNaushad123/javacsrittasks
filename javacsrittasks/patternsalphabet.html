<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
        // 1.
      for (let j = 1; j <= 7; j++) {
        for (let i = 1; i <= 7; i++) {
          if (i == 1 ||i == 7 ||(j == i && j <= 4) ||(i + j == 8 && j <= 4)) {
            document.write("*");
          } else {
            document.write("&nbsp;&nbsp;");
          }
        }
        document.write("<br>");
      }


      
    //   2.
       for(let j=1; j<=7; j++){
       for(let i=1; i<=7; i++){

        if(j==1 || j==4 || j==7 || i==1){

            document.write("*");

        } else {
            document.write("&nbsp;&nbsp;");
        }
    }
    document.write("<br>");
    }

    
// 3.
    for(let j=1; j<=7; j++){
    for(let i=1; i<=7; i++){

        if(i==1 || i==7 || j==4){

            document.write("*");

        } else {
            document.write("&nbsp;&nbsp;");
        }
    }
    document.write("<br>");  
    }


    
// 4.
    for(let j=1; j<=7; j++){
    for(let i=1; i<=7; i++){

        if(j==1 || i==4){

            document.write("*");

        } else {
            document.write("&nbsp;&nbsp;");
        }
    }
    document.write("<br>");
    }





    </script>
  </body>
</html>
