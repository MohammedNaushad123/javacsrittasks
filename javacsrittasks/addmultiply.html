<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks</title>

    <script>

        function calculateTotal() {

            var m1 = parseInt(document.getElementById("m1").value);
            var m2 = parseInt(document.getElementById("m2").value);
            var m3 = parseInt(document.getElementById("m3").value);

            var total = m1 + m2 + m3;

            document.getElementById("result").value = total;

            return false;
        }


        function calculateAverage() {

            var m1 = parseInt(document.getElementById("m1").value);
            var m2 = parseInt(document.getElementById("m2").value);
            var m3 = parseInt(document.getElementById("m3").value);

            var average = (m1 + m2 + m3) / 3;

            document.getElementById("result").value = average;

            return false;
        }

    </script>
</head>

<body>

    <label>Enter Subject 1 Marks :</label>
    <input type="text" placeholder="Subject 1" id="m1">
    <br><br>

    <label>Enter Subject 2 Marks :</label>
    <input type="text" placeholder="Subject 2" id="m2">
    <br><br>

    <label>Enter Subject 3 Marks :</label>
    <input type="text" placeholder="Subject 3" id="m3">
    <br><br>

    <label>Result :</label>
    <input type="text" placeholder="Result" id="result">
    <br><br>

    <button onclick="calculateTotal()">Total</button>

    <button onclick="calculateAverage()">Average</button>

</body>
</html>
